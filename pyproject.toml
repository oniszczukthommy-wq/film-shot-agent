[project]
name = "film-shot-agent"
version = "0.1.0"
description = "Cinematic shot & line search, plus a research agent for finding and vetting films"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2,<3",
    "pydantic-settings>=2.5,<3",
    "pysubs2>=1.8,<2",
    "imageio-ffmpeg>=0.5,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/film_shot_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/Query 默认值是框架惯用法
