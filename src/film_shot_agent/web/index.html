<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shot Agent · 影视镜头与台词检索</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="demo-banner" id="demo-banner" hidden>
  线上演示站只带索引和缩略图；影片播放与切片请在本地运行，问片功能完整。
</div>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo">SHOT<b>·</b>AGENT<i></i></div>
    <div class="nav-links" id="nav">
      <a href="/">问片</a>
      <button data-view="agent" aria-selected="true">助理</button>
      <button data-view="shots">镜头</button>
      <button data-view="lines">台词</button>
      <button data-view="decks">参考板</button>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-stat" id="stat">—</div>
  </div>
</nav>

<header class="hero" id="hero">
  <div class="hero-blob a"></div>
  <div class="hero-blob b"></div>
  <div class="hero-blob c"></div>
  <div class="wrap hero-inner">
    <h1>一句话，找到<em>那一镜</em>。</h1>
    <p class="sub" id="hero-sub">
      244 个镜头全部由 ffmpeg 自动抽帧、算出调色板之后建索引。说你要什么画面，
      或者一句台词，助理自己决定调哪个工具。
    </p>
    <form class="ask" id="agent-form">
      <input id="agent-input" autocomplete="off"
        placeholder="冷色调、暗一点的镜头 ／ 钢铁之泪里说 robot 的台词" />
      <button class="btn" id="agent-send" type="submit">问助理</button>
    </form>
    <div class="suggests" id="suggests"></div>
    <a class="ask-link" href="/">问片 · 找电影、查评分、认镜头、找台词 →</a>
    <div id="answer-slot"></div>
  </div>
</header>

<div class="wrap">
  <div class="stage">
    <aside class="rail">
      <section class="panel">
        <h3>取色检索</h3>
        <div class="picker">
          <div class="picker-row">
            <input type="color" id="shade" value="#3a6ea5" />
            <span>画面主色</span>
            <span class="val" id="shade-hex">#3a6ea5</span>
          </div>
          <div class="picker-row">
            <span>容差</span>
            <input type="range" id="distance" min="3" max="18" value="8" />
            <span class="val" id="distance-v">8</span>
          </div>
          <div class="picker-row">
            <span>最小占比</span>
            <input type="range" id="proportion" min="0" max="50" value="3" />
            <span class="val" id="proportion-v">3%</span>
          </div>
        </div>
        <div style="margin-top:20px">
          <button class="btn btn-sm" id="apply-shade" style="width:100%">按这个颜色找</button>
        </div>
      </section>

      <section class="panel" id="facets-panel">
        <div class="panel-head"><h3>筛选</h3></div>
        <div id="facets"><p class="hint">问一句试试，或选下面的条件。</p></div>
      </section>

      <section class="panel">
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-quiet" id="reset" style="flex:1">清空</button>
          <button class="btn btn-sm btn-quiet" id="copy-link" style="flex:1">复制链接</button>
        </div>
      </section>
    </aside>

    <main><div id="view"></div></main>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-wrap">
    <div class="modal" id="modal-body"></div>
    <button class="close" id="modal-close">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
