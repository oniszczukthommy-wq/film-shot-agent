<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shot Agent · 影视镜头与台词检索</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">SHOT<span>·</span>AGENT <small>cinematic shot &amp; line search</small></div>
  <nav class="topnav" id="nav">
    <button data-view="agent" aria-selected="true">助理</button>
    <button data-view="shots">镜头</button>
    <button data-view="lines">台词</button>
    <button data-view="decks">参考板</button>
  </nav>
  <div class="spacer"></div>
  <div class="stat" id="stat">—</div>
</header>

<section class="agent" id="agent-panel">
  <form class="agent-form" id="agent-form">
    <input class="agent-input" id="agent-input" autocomplete="off"
      placeholder="用一句话描述你要的画面或台词，例如：冷色调、暗一点的镜头 / 钢铁之泪里说 robot 的台词" />
    <button class="agent-send" id="agent-send" type="submit">问助理</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="agent-reply" id="agent-reply" hidden></div>
</section>

<div class="layout">
  <aside class="rail">
    <h3>取色检索</h3>
    <div class="picker">
      <div class="picker-row">
        <input type="color" id="shade" value="#3a6ea5" />
        <span>画面主色</span>
      </div>
      <div class="picker-row">
        <span>容差</span><input type="range" id="distance" min="3" max="18" value="8" />
        <b id="distance-v" class="hint">8</b>
      </div>
      <div class="picker-row">
        <span>最小占比</span><input type="range" id="proportion" min="0" max="50" value="3" />
        <b id="proportion-v" class="hint">3%</b>
      </div>
    </div>
    <div class="rail-actions">
      <button id="apply-shade">按这个颜色找</button>
    </div>
    <div id="facets"></div>
    <div class="rail-actions">
      <button id="reset">清空筛选</button>
      <button id="copy-link">复制查询链接</button>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-wrap">
    <div class="modal" id="modal-body"></div>
    <button class="close" id="modal-close">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
